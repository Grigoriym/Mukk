name: Release Prepare

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.2)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Set up git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        run: git checkout -b release/v${{ inputs.version }}

      - name: Bump version in libs.versions.toml
        run: sed -i 's/^version-name = ".*"/version-name = "${{ inputs.version }}"/' gradle/libs.versions.toml

      - name: Commit and push
        run: |
          git add gradle/libs.versions.toml
          git commit -m "Release v${{ inputs.version }}"
          git push origin release/v${{ inputs.version }}

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base master \
            --head release/v${{ inputs.version }} \
            --title "Release v${{ inputs.version }}" \
            --body "## Release v${{ inputs.version }}

          ### Before merging
          - [ ] Review version bump in \`gradle/libs.versions.toml\`

          ### After merging (automatic)
          - Tag \`v${{ inputs.version }}\` will be created and pushed
          - \`release.yml\` will build the \`.deb\`/\`.rpm\` and create the GitHub Release"
